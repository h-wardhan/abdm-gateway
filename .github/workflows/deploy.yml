name: Deploy

# develop  -> sandbox server, automatically, once CI has passed
# main     -> production, ONLY by hand (Run workflow) and ONLY after a reviewer approves the `production` environment
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [sandbox, production]
        default: sandbox

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'sandbox' }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push image
    # automatic runs only for a green CI on develop; manual runs for whatever ref was picked
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Production deploys only come from main
        if: github.event.inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Production can only be deployed from main (this run is on ${GITHUB_REF})." >&2
          exit 1
      - id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${sha:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.event.inputs.environment == 'production' && 'main' || 'develop' }}

  sandbox:
    name: Deploy to sandbox
    needs: image
    if: github.event_name == 'workflow_run' || github.event.inputs.environment == 'sandbox'
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/remote-deploy.sh

  production:
    name: Deploy to production
    needs: image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers on this environment in the GitHub settings
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/remote-deploy.sh
